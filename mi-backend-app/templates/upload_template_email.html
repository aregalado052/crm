{% extends "base.html" %}

{% block content %}

<!-- Botón para abrir modal -->
<button id="btnOpenImportModal" 
        class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
  📩 Subir Plantilla
</button>


<button id="btnSeleccionPlantillasEmail" 
        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
  📩 Seleccionar Plantilla Email
</button>


<button id="btnSeleccionPlantillasNewsletter" 
        class="px-4 py-2 bg-gray-700 text-white rounded-lg hover:bg-gray-900">
  📩 Seleccionar Plantilla Newsletter
</button>

<button id="btnActualizarPlantillas" 
        class="px-4 py-2 bg-orange-400 text-white rounded-lg hover:bg-orange-700">
  📩 Subir Imagenes y Archivos Adjuntos
</button>

<button id="btn-exit"
        type="button"               
        class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
        {{ _('Salir') }}
</button>

<div class="mt-4 overflow-x-auto">
  <table id="tplTable" class="min-w-full border rounded-lg">
    <thead class="bg-gray-50">
      <tr>
        <th class="text-left p-2 border-b">Nombre</th>
        <th class="text-left p-2 border-b">Tipo</th>
        <th class="text-left p-2 border-b">Acciones</th>
        <th class="text-left p-2 border-b"></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Modal de preview -->
<div id="previewModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
  <div class="bg-white w-full max-w-4xl rounded-xl shadow-xl p-4">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-bold text-lg">Preview</h3>
      <button id="btnClosePreview" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Cerrar</button>
    </div>
    <iframe id="previewFrame" class="w-full h-[70vh] border rounded"></iframe>
  </div>
</div>


<!-- Modal -->
<!-- Modal -->
<div id="importModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-[60]">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6">

    <h2 id="modalTitle" class="text-xl font-bold mb-4">Importar plantilla</h2>

    <!-- Nombre -->
    <div id="templateNameBlock">
      <label class="block text-sm mb-2">Nombre</label>
      <input id="templateName"
             type="text"
             placeholder="Nombre de la plantilla"
             class="w-full border rounded-lg p-2 mb-4"
             style="caret-color: black;"
             >
             
    </div>

    <!-- Tipo -->
    <div id="templateTypeBlock">
      <label class="block text-sm mb-2">Tipo de plantilla</label>
      <select id="templateType" class="w-full border rounded-lg p-2 mb-4">
        <option value="email" selected>Email</option>
        <option value="newsletter">Newsletter</option>
      </select>
    </div>

    <!-- Idioma -->
    <div id="templateLangBlock">
      <label class="block text-sm mb-2">Idioma</label>
      <select id="templateLang" class="w-full border rounded-lg p-2 mb-4">
        <option value="es">Español</option>
        <option value="en">Inglés</option>
      </select>
    </div>

    <!-- HTML manual -->
    <div id="templateHtmlBlock">
      <label class="block text-sm mb-2">HTML</label>
      <textarea id="templateHtml"
                rows="8"
                class="w-full border rounded-lg p-2 font-mono text-sm"
                placeholder="Pega aquí el HTML del email..."></textarea>
    </div>

    <!-- Archivo -->
    <div class="mt-4" id="fileInputBlock">
      <label id="fileInputLabel" class="block text-sm mb-2">
        O selecciona un archivo
      </label>

      <input id="fileInput"
             type="file"
             class="w-full border rounded-lg p-2">

      <div id="dropZone"
           class="mt-4 border-2 border-dashed border-gray-300 rounded-xl p-6 text-center text-gray-500 bg-gray-50 transition">
        Arrastra aquí un archivo o haz clic en el selector de arriba
      </div>
    </div>

    <!-- Preview -->
    <div id="previewContainer" class="hidden mt-6 border rounded-lg p-4 bg-gray-50">
      <h3 class="font-bold mb-2">Vista previa</h3>
      <iframe id="previewIframe" class="w-full h-64 border rounded-lg"></iframe>
    </div>

    <!-- Botones -->
    <div class="flex justify-end gap-2 mt-6">
      <button id="btnCloseModal"
              type="button"
              class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">
        Volver
      </button>

      <button id="btnUploadTemplate"
              type="button"
              class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
        Guardar plantilla
      </button>
    </div>

  </div>
</div>


{% endblock %}

{% block scripts %}
<script>

function arrayBufferToBase64(buffer) {
  let binary = "";
  const bytes = new Uint8Array(buffer);
  const len = bytes.byteLength;
  for (let i = 0; i < len; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}
document.addEventListener("DOMContentLoaded", () => {
  const openModalBtn     = document.getElementById("btnOpenImportModal");
  const modal            = document.getElementById("importModal");
  const closeModalBtn    = document.getElementById("btnCloseModal");
  const uploadBtn        = document.getElementById("btnUploadTemplate");

  const fileInput        = document.getElementById("fileInput");
  const fileInputLabel   = document.getElementById("fileInputLabel");
  const dropZone         = document.getElementById("dropZone");

  const textArea         = document.getElementById("templateHtml");
  const previewContainer = document.getElementById("previewContainer");
  const previewIframe    = document.getElementById("previewIframe");

  const nameInput        = document.getElementById("templateName");
  const templateType     = document.getElementById("templateType");
  const templateLang     = document.getElementById("templateLang");
  const modalTitle       = document.getElementById("modalTitle");

  const required = {
    openModalBtn, modal, closeModalBtn, uploadBtn,
    fileInput, textArea, nameInput, templateType, templateLang
  };

  for (const [k, el] of Object.entries(required)) {
    if (!el) {
      console.error(`[IMPORT] Falta el elemento #${k} en el DOM`);
    }
  }

  if (!openModalBtn || !modal) return;

  const safePreview = !!(previewContainer && previewIframe);


  
  let uploadMode = "crear";
  let currentSlug = "";
  let currentLang = "";
  let currentRefresh = null;

  function $(id) {
    return document.getElementById(id);
  }

  function resetImportModal() {
    $("modalTitle").textContent = "Importar plantilla";

    $("templateName").value = "";
    $("templateName").readOnly = false;

    $("templateType").value = "email";
    $("templateType").disabled = false;

    $("templateLang").value = "es";
    $("templateLang").disabled = false;

    $("templateHtml").value = "";

    $("fileInput").value = "";
    $("fileInput").accept = ".html,.htm,.eml,.zip";

    $("fileInputLabel").textContent = "O selecciona un archivo";

    $("btnUploadTemplate").textContent = "Guardar plantilla";

    $("templateNameBlock").classList.remove("hidden");
    $("templateTypeBlock").classList.remove("hidden");
    $("templateLangBlock").classList.remove("hidden");
    $("templateHtmlBlock").classList.remove("hidden");
    $("fileInputBlock").classList.remove("hidden");
  } 

  

  function hidePreview() {
    if (!safePreview) return;
    previewContainer.classList.add("hidden");
    previewIframe.removeAttribute("srcdoc");
  }

  function showPreview(html) {
    if (!safePreview) return;
    previewIframe.srcdoc = html;
    previewContainer.classList.remove("hidden");
  }

  function resetFileAndPreview() {
    if (fileInput) fileInput.value = "";
    hidePreview();
  }

  function getCurrentTemplateType() {
    return templateType?.value || "email";
  }

  function openImportModalCreate() {
    uploadMode = "crear";

    resetImportModal();

    updateImportUI();   // 👈 AQUÍ

    document.getElementById("importModal").classList.remove("hidden");
  }



  function openImportModalUpdateNewsletter({ slug, lang, refresh }) {
    uploadMode = "actualizar_newsletter";
    currentSlug = slug || "";
    currentLang = lang || "es";
    currentRefresh = typeof refresh === "function" ? refresh : null;

    resetImportModal();


    $("modalTitle").textContent = "Actualizar Newsletter";

    $("dropZone").textContent = "Arrastra aquí un .html o .zip de newsletter, o haz clic para seleccionar";

    $("templateName").value = currentSlug;
    $("templateName").readOnly = true;

    $("templateType").value = "newsletter";
    $("templateType").disabled = true;

    $("templateLang").value = currentLang;
    $("templateLang").disabled = true;

    $("templateHtmlBlock").classList.add("hidden");

    $("fileInput").accept = ".html,.htm,.zip";
    $("fileInputLabel").textContent =
      "Selecciona el archivo para actualizar la newsletter (.html o .zip)";

    $("btnUploadTemplate").textContent = "Actualizar newsletter";

    $("importModal").classList.remove("hidden");
  }

  function closeImportModal() {
    $("importModal").classList.add("hidden");
  }

  document.addEventListener("DOMContentLoaded", () => {
    $("btnCloseModal").addEventListener("click", (e) => {
      e.preventDefault();
      closeImportModal();
    });

    $("btnUploadTemplate").addEventListener("click", async (e) => {
      e.preventDefault();

      const name = $("templateName").value.trim();
      const type = $("templateType").value;
      const lang = $("templateLang").value;
      const textHtml = $("templateHtml").value.trim();
      const file = $("fileInput").files && $("fileInput").files[0];

      try {
        let payload = {};

        if (uploadMode === "crear") {
          if (!name) {
            return Swal.fire({
              icon: "warning",
              title: "Falta el nombre",
              text: "Por favor, indica un nombre."
            });
          }

          payload = {
            name,
            lang,
            template_type: type
          };

          if (file) {
            const buf = await file.arrayBuffer();
            const b64 = arrayBufferToBase64(buf);

            if (/\.zip$/i.test(file.name)) {
              payload.zip_base64 = b64;
              payload.filename = file.name;
            } else if (/\.html?$/i.test(file.name)) {
              payload.html = await file.text();
              payload.filename = file.name;
            } else if (/\.eml$/i.test(file.name) && type === "email") {
              payload.eml_base64 = b64;
              payload.filename = file.name;
            } else {
              throw new Error("Archivo no permitido para este tipo de plantilla");
            }
          } else {
            if (!textHtml) {
              return Swal.fire({
                icon: "warning",
                title: "Contenido vacío",
                text: "Pega HTML o selecciona un archivo"
              });
            }
            payload.html = textHtml;
          }
        }

        if (window.uploadMode === "actualizar_newsletter") {

         

          payload = {
            name: window.currentSlug,
            slug: window.currentSlug,
            lang: window.currentLang,
            template_type: "newsletter"
          };

          

          const buf = await file.arrayBuffer();
          const b64 = arrayBufferToBase64(buf);

          if (/\.zip$/i.test(file.name)) {
            payload.zip_base64 = b64;
            payload.filename = file.name;
          } else if (/\.html?$/i.test(file.name)) {
            payload.html = await file.text();
            payload.filename = file.name;
          } else {
            throw new Error("Solo .html o .zip");
          }

          Swal.fire({
            title: "Actualizando...",
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
          });

          console.log("PAYLOAD FINAL:", payload);
          

          const res = await fetch("/upload_template_email", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

          Swal.fire({
            icon: "success",
            title: "Newsletter actualizada ✅",
            text: data.slug || window.currentSlug,
            timer: 2000,
            showConfirmButton: false
          });

          document.getElementById("importModal").classList.add("hidden");

          if (typeof window.currentRefresh === "function") {
            window.currentRefresh();
          }

          return;
        }
        Swal.fire({
          title: uploadMode === "actualizar_newsletter" ? "Actualizando..." : "Guardando...",
          text: "Por favor espera",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });

        console.log("PAYLOAD FINAL:", payload);
        


        const res = await fetch("/upload_template_email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        Swal.fire({
          icon: "success",
          title: uploadMode === "actualizar_newsletter"
            ? "Newsletter actualizada ✅"
            : "Plantilla guardada ✅",
          text: data.slug || data.template_id || currentSlug || "",
          timer: 2200,
          showConfirmButton: false
        });

        closeImportModal();

        if (uploadMode === "actualizar_newsletter" && typeof currentRefresh === "function") {
          currentRefresh();
        }

      } catch (err) {
        Swal.fire({
          icon: "error",
          title: "Error",
          text: err.message || "Error inesperado"
        });
      }
    });
  });

  function updateImportUI() {
    const type = document.getElementById("templateType")?.value;

   

    if (type === "newsletter" ) {
      modalTitle.textContent = "Importar newsletter";
      fileInput.setAttribute("accept", ".html,.htm,.zip");
      fileInputLabel.textContent = "Selecciona un archivo (.html o .zip)";
      textArea.placeholder = "Pega aquí el HTML de la newsletter...";
      dropZone.textContent = "Arrastra aquí un .html o .zip de newsletter, o haz clic para seleccionar";
    } else {
      modalTitle.textContent = "Importar plantilla de email";
      fileInput.setAttribute("accept", ".html,.htm,.eml");
      fileInputLabel.textContent = "Selecciona un archivo (.eml o .html)";
      textArea.placeholder = "Pega aquí el HTML del email...";
      dropZone.textContent = "Arrastra aquí un .eml o .html de email, o haz clic para seleccionar";
    }

    resetFileAndPreview();
  }



  function isAllowedFile(file) {
    if (!file) return false;

    const name = (file.name || "").toLowerCase();
    const type = getCurrentTemplateType();

    if (type === "newsletter") {
      return name.endsWith(".html") || name.endsWith(".htm") || name.endsWith(".zip");
    }

    return name.endsWith(".html") || name.endsWith(".htm") || name.endsWith(".eml");
  }

  async function processSelectedFile(file) {
    if (!file) return;

    if (!isAllowedFile(file)) {
      await Swal.fire({
        icon: "warning",
        title: "Archivo no válido",
        text: getCurrentTemplateType() === "newsletter"
          ? "Para newsletter usa .html o .zip"
          : "Para email usa .html o .eml"
      });

      if (fileInput) fileInput.value = "";
      hidePreview();
      return;
    }

    // Sincroniza el fichero en el input real
    if (fileInput) {
      const dt = new DataTransfer();
      dt.items.add(file);
      fileInput.files = dt.files;
    }

    const fileName = file.name || "";
    const type = getCurrentTemplateType();

    hidePreview();

    // EMAIL
    if (type === "email") {
      if (/\.eml$/i.test(fileName)) {
        if (textArea) {
          textArea.value = `# .eml seleccionado: ${fileName}\n(Se enviará como eml_base64)`;
        }
        return;
      }

      if (/\.html?$/i.test(fileName)) {
        const text = await file.text();
        if (textArea) textArea.value = text;
        showPreview(text);
        return;
      }
    }

    // NEWSLETTER
    if (type === "newsletter") {
      if (/\.zip$/i.test(fileName)) {
        if (textArea) {
          textArea.value = `# .zip seleccionado: ${fileName}\n(Se enviará como zip_base64)`;
        }
        // No preview si es ZIP
        hidePreview();
        return;
      }

      if (/\.html?$/i.test(fileName)) {
        const text = await file.text();
        if (textArea) textArea.value = text;
        showPreview(text);
        return;
      }
    }
  }

  openModalBtn.addEventListener("click", (e) => {
    e.preventDefault();
    modal.classList.remove("hidden");
    openImportModalCreate();
  });

  closeModalBtn?.addEventListener("click", (e) => {
    e.preventDefault();
    modal.classList.add("hidden");
  });

  templateType?.addEventListener("change", () => {
    updateImportUI();
  });

  fileInput?.addEventListener("change", async () => {
    const file = fileInput.files && fileInput.files[0];
    await processSelectedFile(file);
  });

  // Drag & drop
  if (dropZone) {
    dropZone.addEventListener("click", () => {
      fileInput?.click();
    });

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("border-blue-500", "bg-blue-50", "text-blue-700");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("border-blue-500", "bg-blue-50", "text-blue-700");
    });

    dropZone.addEventListener("drop", async (e) => {
      e.preventDefault();
      dropZone.classList.remove("border-blue-500", "bg-blue-50", "text-blue-700");

      const file = e.dataTransfer?.files?.[0];
      await processSelectedFile(file);
    });
  }

  uploadBtn.addEventListener("click", async (e) => {
    e.preventDefault();

    const name = nameInput?.value?.trim() || "";
    if (!name) {
      return Swal.fire({
        icon: "warning",
        title: "Falta el nombre",
        text: "Por favor, indica un nombre."
      });
    }

    const lang = templateLang?.value || "es";
    const type = getCurrentTemplateType();
    const file = fileInput?.files && fileInput.files[0];
    const payload = { name, lang, template_type: type };

    try {
      if (file) {
        const buf = await file.arrayBuffer();
        const b64 = arrayBufferToBase64(buf);

        if (type === "email") {
          if (/\.eml$/i.test(file.name)) {
            payload.eml_base64 = b64;
          } else if (/\.html?$/i.test(file.name)) {
            payload.html = await file.text();
          } else {
            throw new Error("Para email solo se permite .eml o .html");
          }
        } else {
          if (/\.zip$/i.test(file.name)) {
            payload.zip_base64 = b64;
            payload.filename = file.name;
          } else if (/\.html?$/i.test(file.name)) {
            payload.html = await file.text();
          } else {
            throw new Error("Para newsletter solo se permite .zip o .html");
          }
        }
      } else {
        const pastedHtml = (textArea?.value || "").trim();
        if (!pastedHtml) {
          return Swal.fire({
            icon: "warning",
            title: "Contenido vacío",
            text: type === "newsletter"
              ? "Pega HTML o selecciona un .html/.zip"
              : "Pega HTML o selecciona un .html/.eml"
          });
        }
        payload.html = pastedHtml;
      }

      Swal.fire({
        title: "Procesando...",
        text: "Guardando plantilla, por favor espera",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      console.log("[FRONT DEBUG] file?", !!file, "payload keys:", Object.keys(payload));
      console.log("PAYLOAD FINAL:", payload);
      


      const res = await fetch("/upload_template_email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

      Swal.fire({
        icon: "success",
        title: "Plantilla guardada ✅",
        text: `${type === "newsletter" ? "Newsletter" : "Email"}: ${data.slug || data.template_id || ""}`,
        timer: 2500,
        showConfirmButton: false
      });

      hidePreview();
      if (fileInput) fileInput.value = "";

    } catch (err) {
      Swal.fire({
        icon: "error",
        title: "Error al guardar",
        text: err.message || "Ocurrió un error inesperado"
      });
    }
  });

  updateImportUI();
});



  


 



document.getElementById('btn-exit').addEventListener('click', function (e) {
  
  e.preventDefault();
  const ruta = '/base';
  const data = {};

  salir();
  async function salir() {

    try {
      const response = await fetch(ruta, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        credentials: 'include',
        body: JSON.stringify(data)
      });

      if (!response.ok) throw new Error("{{ _('Error en la respuesta del servidor.') }}");

      const html = await response.text();
      document.open();
      document.write(html);
      document.close();

    } catch (error) {
      console.error("Error al enviar datos:", error);
      Swal.fire({
        icon: 'error',
        title: '{{ _("Error") | escapejs }}',
        text: '{{ _("No se pudo cargar la página. Inténtalo de nuevo más tarde.") | escapejs }}',
        confirmButtonColor: '#3085d6'
      });
    };
  } 
});

const btnSelemail = document.getElementById("btnSeleccionPlantillasEmail");
const btnSelnewsletter = document.getElementById("btnSeleccionPlantillasNewsletter");
const tbody = document.querySelector("#tplTable tbody");
const previewModal = document.getElementById("previewModal");
const previewFrame = document.getElementById("previewFrame");
const btnClosePreview = document.getElementById("btnClosePreview");
const btnUpdate = document.getElementById("btnActualizarPlantillas");

btnSelemail.addEventListener("click", async () => {
  try {
    const res = await fetch("/list_templates?type=email");
    if (!res.ok) throw new Error("No se pudo listar");
    const templates = await res.json();

    tbody.innerHTML = "";

    for (const tpl of templates) {
      const slug = tpl.slug || "";
      const name = tpl.display_name || slug;
      const description = tpl.description || "";
      const langs = Array.isArray(tpl.languages) ? tpl.languages : [];
      const type = tpl.type || "email";

      const langsHtml = (langs.length > 0)
        ? langs.map(l => `<span class="px-2 py-0.5 rounded bg-gray-100 border mr-1">${l}</span>`).join("")
        : `<span class="text-gray-400 italic">sin idiomas</span>`;

      let actionsHtml = "";
      if (langs.length > 0) {
        for (const lang of langs) {
          const ts = Date.now();
          const type = tpl.type || "email";
          const rawUrl = `/templates/${slug}/${lang}/preview?type=${encodeURIComponent(type)}&raw=1&ts=${ts}`;
          const tplUrl = `/templates/${slug}/${lang}/preview?type=${encodeURIComponent(type)}&raw=0&ts=${ts}`;

          actionsHtml += `
            <button class="px-2 py-1 bg-gray-200 rounded hover:bg-gray-300 mr-1"
                    onclick="window.open('${rawUrl}','_blank')">👀 ${lang}</button>
            <button class="px-2 py-1 bg-blue-600 text-white rounded hover:bg-blue-700 mr-2"
                    onclick="openPreviewWindow('${tplUrl}','_blank')">🖌️ ${lang}</button>
          `;
        }
      } else {
        actionsHtml = `<span class="text-gray-400">—</span>`;
      }

      
      
      const deleteButton = `
        <button class="px-2 py-1 bg-red-600 text-white rounded hover:bg-red-700 btn-delete"
                data-slug="${encodeURIComponent(slug)}"
                data-type="${type}">🗑️</button>
      `;

      tbody.insertAdjacentHTML("beforeend", `
        <tr class="border-b hover:bg-gray-50">
          <td class="p-2">${name}</td>
          <td class="p-2">${type}</td>
          <td class="p-2"><div class="flex flex-wrap gap-1">${actionsHtml}</div></td>
          <td class="p-2 text-right">${deleteButton}</td>
        </tr>
      `);
    }

  } catch (err) {
    console.error(err);
    alert("Error al cargar plantillas.");
  }
});

btnSelnewsletter.addEventListener("click", async () => {
  try {
    const res = await fetch("/list_templates?type=newsletter");
    if (!res.ok) throw new Error("No se pudo listar");
    const templates = await res.json();

    tbody.innerHTML = "";

    for (const tpl of templates) {
      const slug = tpl.slug || "";

// define deleteRow en el mismo scope (no dentro del addEventListener del botón principal)
async function deleteRow(btn, slug, type) {
  const row = btn.closest('tr');
  if (!row) return;

  const result = await Swal.fire({
    title: `¿Seguro que quieres borrar "${slug}"?`,
    text: `Tipo: ${type}`,
    icon: "warning",
    showCancelButton: true,
    confirmButtonText: "Sí, borrar",
    cancelButtonText: "Cancelar",
    reverseButtons: true
  });

  if (!result.isConfirmed) return;

  btn.disabled = true;

  try {
    const res = await fetch(`/templates/${encodeURIComponent(slug)}?type=${encodeURIComponent(type)}`, {
      method: "DELETE",
      credentials: "same-origin",
      headers: { Accept: "application/json" }
    });

    if (!res.ok) {
      let msg = "No se pudo borrar.";
      try {
        const data = await res.json();
        if (data?.error) msg = data.error;
      } catch {}

      await Swal.fire({
        icon: "error",
        title: "Error",
        text: msg
      });
      btn.disabled = false;
      return;
    }

    row.remove();

    Swal.fire({
      icon: "success",
      title: "Borrado",
      text: `La plantilla "${slug}" fue eliminada.`,
      timer: 2000,
      showConfirmButton: false
    });

  } catch {
    await Swal.fire({
      icon: "error",
      title: "Error de red",
      text: "Inténtalo de nuevo."
    });
    btn.disabled = false;
  }
}

function openPreviewWindow(url) {
  const w = window.open('', 'previewWindow', 'width=1000,height=720,resizable=yes,scrollbars=yes');
  if (!w) { alert('El navegador bloqueó la ventana emergente.'); return; }

  // Parse slug/lang desde /templates/:slug/:lang/...
  let slug = '', lang = '';
  try {
    const u = new URL(url, window.location.origin);
    const m = u.pathname.match(/\/templates\/([^/]+)\/([^/]+)\//i);
    if (m) { slug = decodeURIComponent(m[1]); lang = decodeURIComponent(m[2]); }
  } catch {}

  // --- Esqueleto sin <script> ni onclick (CSP-safe) ---
  const doc = w.document;
  doc.open();
  doc.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Vista previa</title></head><body></body></html>');
  doc.close();

  // Estilos mínimos (si tu CSP bloquea style inline, quítalos; no son obligatorios)
  const toolbar = doc.createElement('div');
  toolbar.style.cssText = 'display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #ccc;background:#f8f8f8;font-family:system-ui';
  const btnReload = doc.createElement('button'); btnReload.textContent = '↻ Recargar';
  const btnEdit   = doc.createElement('button'); btnEdit.textContent   = '✍️ Editar texto';
  const btnEditSign  = doc.createElement('button'); btnEditSign.textContent  = '✒️ Editar firma';
  
  const btnUpdateNewsletter = doc.createElement("button");
  btnUpdateNewsletter.id = "btn-update-newsletter";
  btnUpdateNewsletter.type = "button";
  btnUpdateNewsletter.textContent = "📰 Actualizar Newsletter";
  btnUpdateNewsletter.className = "px-3 py-1 rounded-lg bg-blue-600 text-white hover:bg-blue-700 text-sm";






  const btnClose  = doc.createElement('button'); btnClose.textContent  = '❌ Cerrar';
  [btnReload, btnEditSign, btnEdit,btnUpdateNewsletter, btnClose].forEach(b => b.style.cssText = 'padding:6px 12px;border:0;border-radius:8px;cursor:pointer;color:#fff;background:#3b82f6');
  btnEditSign.style.background = '#6b7280';
  btnEdit.style.background  = '#10b981';
  btnClose.style.background = '#e74c3c';
  btnClose.style.marginLeft = 'auto';
  
  toolbar.append(btnReload, btnEditSign, btnEdit, btnUpdateNewsletter, btnClose);

  const iframe = doc.createElement('iframe');
  iframe.style.cssText = 'border:0;width:100%;height:calc(100vh - 46px)';
  iframe.dataset.base = url;
  iframe.src = url;

  doc.body.append(toolbar, iframe);

  // --- Lógica/handlers enganchados desde el padre (no inline) ---
  function refresh() {
    const base = iframe.dataset.base || url;
    const sep = base.includes('?') ? '&' : '?';
    iframe.src = base + sep + 'ts=' + Date.now();
  }

  btnReload.addEventListener('click', refresh);
  btnEditSign .addEventListener('click', () => openEditorSignatureWindow(slug, lang, refresh));
  btnClose .addEventListener('click', () => w.close());
  btnEdit  .addEventListener('click', () => openEditorWindow(slug, lang, refresh));

  let uploadMode = "guardar_nueva";
  let currentSlug = "";
  let currentLang = "";

  btnUpdateNewsletter.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();

   

    console.log("CLICK update desde popup");

    if (w.opener && typeof w.opener.openImportModalUpdateNewsletter === "function") {
      w.opener.openImportModalUpdateNewsletter({
        slug,
        lang,
        refresh
      });

      w.opener.focus();
      w.close();
      return;
    }

    if (typeof openImportModalUpdateNewsletter === "function") {
      openImportModalUpdateNewsletter({ slug, lang, refresh });
      return;
    }

    w.alert("No se pudo abrir el modal");
  });
  document.getElementById("btnUploadTemplate").addEventListener("click", async (e) => {
    e.preventDefault();

    const file = document.getElementById("fileInput").files?.[0];

    if (!file) {
      return Swal.fire({
        icon: "warning",
        title: "Falta archivo",

      });

    try {
      let payload = {};

      if (window.uploadMode === "actualizar_newsletter") {

          lang: window.currentLang,
          template_type: "newsletter"
        };

        const buf = await file.arrayBuffer();
        const b64 = arrayBufferToBase64(buf);

        if (/\.zip$/i.test(file.name)) {
          payload.zip_base64 = b64;
          payload.filename = file.name;
        } else if (/\.html?$/i.test(file.name)) {

          payload.filename = file.name;
        } else {
          throw new Error("Solo .html o .zip");
        }

        Swal.fire({
          title: "Actualizando...",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });

        const res = await fetch("/upload_template_email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        Swal.fire({
          icon: "success",
          title: "Newsletter actualizada ✅",
          text: data.slug || window.currentSlug,
          timer: 2000,
          showConfirmButton: false
        });

        document.getElementById("importModal").classList.add("hidden");

        if (typeof window.currentRefresh === "function") {
          window.currentRefresh();

        return;
      }

    } catch (err) {
      Swal.fire({
        icon: "error",

      });
    }
  });
  // -------- Ventana del editor (CSP-safe) --------
  function openEditorWindow(slug, lang, onSaved) {
    const w2 = window.open('', 'textEditorWindow', 'width=760,height=600,resizable=yes,scrollbars=yes');
    if (!w2) { alert('El navegador bloqueó la ventana del editor.'); return; }

    const d2 = w2.document;
    d2.open();
    d2.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Editar cuerpo</title></head><body></body></html>');
    d2.close();

    const bar = d2.createElement('div');
    bar.style.cssText = 'display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #ddd;font-family:system-ui';
    const btnLoad = d2.createElement('button'); btnLoad.textContent  = 'Cargar';
    const btnSave = d2.createElement('button'); btnSave.textContent  = 'Guardar';
    const btnClo2 = d2.createElement('button'); btnClo2.textContent  = 'Cerrar';
    [btnLoad, btnSave, btnClo2].forEach(b => b.style.cssText = 'padding:6px 12px;border:0;border-radius:8px;cursor:pointer;color:#fff;background:#3b82f6');
    btnSave.style.background = '#10b981';
    btnClo2.style.background = '#e74c3c';
    const msg = d2.createElement('span'); msg.style.cssText = 'margin-left:auto;color:#6b7280';
    bar.append(btnLoad, btnSave, btnClo2, msg);

    const ta = d2.createElement('textarea');
    ta.placeholder = 'Pega aquí el nuevo HTML para lang/partials/message.html';
    ta.style.cssText = 'width:100%;height:calc(100vh - 46px);border:0;outline:none;padding:12px;box-sizing:border-box;font-family:monospace';

    d2.body.append(bar, ta);

    const getUrl = `/api/templates/${slug}/${lang}/partials/message`;

    btnLoad.addEventListener('click', async () => {
      try {
        const r = await fetch(getUrl, { cache: 'no-store' });
        if (!r.ok) throw new Error('No se pudo leer message.html');
        ta.value = await r.text();
        msg.textContent = 'Cargado ✔'; setTimeout(() => msg.textContent = '', 1500);
      } catch (e) {
        alert(e.message || e);
      }
    });

    btnSave.addEventListener('click', async () => {
      const body = ta.value;
      if (!body.trim()) { alert('Pega contenido antes de guardar.'); return; }
      try {
        const r = await fetch(getUrl, {
          method: 'PUT',
          headers: { 'Content-Type': 'text/plain; charset=utf-8' },
          body
        });
        if (!r.ok) {
          const t = await r.text().catch(() => '');
          throw new Error('No se pudo guardar: ' + t);
        }
        msg.textContent = 'Guardado ✔'; setTimeout(() => msg.textContent = '', 1500);
        onSaved && onSaved(); // refresca el preview
      } catch (e) {
        alert(e.message || e);
      }
    });

    btnClo2.addEventListener('click', () => w2.close());

    // Carga inicial
    btnLoad.click();
  }

  
  function openEditorSignatureWindow(slug, lang, onSaved) {
  // endpoint de firma (sin lang)
    var sigUrl = "/api/templates/" + encodeURIComponent(slug) + "/partials/signature";

    var w = window.open("", "signatureEditorWindow", "width=1100,height=750,resizable=yes,scrollbars=yes");
    if (!w) { alert("El navegador bloqueó la ventana del editor."); return; }

    // ---------- Shell básica (sin <script> embebidos) ----------
    var d = w.document;
    d.open();
    d.write(
      '<!doctype html><html lang="es"><head>' +
        '<meta charset="utf-8"><title>Editar firma</title>' +
        '<style>' +
          'html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}' +
          '.bar{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #e5e7eb;background:#f8fafc}' +
          '.bar button{padding:6px 10px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer}' +
          '.bar .ok{background:#10b981;color:#fff;border-color:#10b981}' +
          '.bar .danger{background:#ef4444;color:#fff;border-color:#ef4444}' +
          '.bar .msg{margin-left:auto;color:#6b7280;font-size:12px}' +
          '.wrap{display:grid;grid-template-columns:1fr 1fr;height:calc(100% - 49px)}' +
          '.pane{height:100%}' +
          '.code{border-right:1px solid #e5e7eb}' +
          'textarea{width:100%;height:100%;box-sizing:border-box;border:0;outline:none;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}' +
          'iframe{width:100%;height:100%;border:0;background:#fff}' +
        '</style>' +
      '</head><body>' +
        '<div class="bar">' +
          '<button id="btnLoad">⟳ Cargar</button>' +
          '<button id="btnFile">📄 Importar .html</button>' +
          '<button id="btnPaste">📋 Pegar</button>' +
          '<button id="btnOpenTab">🔗 Abrir vista previa</button>' +
          '<button id="btnSave" class="ok">💾 Guardar</button>' +
          '<button id="btnClose" class="danger">✖ Cerrar</button>' +
          '<span id="msg" class="msg"></span>' +
        '</div>' +
        '<div class="wrap">' +
          '<div class="pane code"><textarea id="ta" placeholder="Pega aquí el HTML de la firma (partials/signature.html)"></textarea></div>' +
          '<div class="pane prev"><iframe id="pv"></iframe></div>' +
        '</div>' +
        '<input type="file" id="fileInput" accept=".html,text/html" style="display:none">' +
      '</body></html>'
    );
    d.close();

    // ---------- Referencias ----------
    var ta = d.getElementById("ta");
    var pv = d.getElementById("pv");
    var msg = d.getElementById("msg");
    var btnLoad = d.getElementById("btnLoad");
    var btnFile = d.getElementById("btnFile");
    var btnPaste = d.getElementById("btnPaste");
    var btnOpenTab = d.getElementById("btnOpenTab");
    var btnSave = d.getElementById("btnSave");
    var btnClose = d.getElementById("btnClose");
    var fileInput = d.getElementById("fileInput");

    // ---------- Estado ----------
    var initial = "";
    var dirty = false;
    function markDirty() {
      dirty = (ta.value !== initial);
      msg.textContent = dirty ? "• Sin guardar" : "";
    }

    // ---------- Helpers ----------
    function updatePreview(html, baseHref) {
      // Inyecta <base> para que rutas relativas funcionen en el iframe
      var hasHead = /<head[^>]*>/i.test(html);
      var baseTag = baseHref ? '<base href="' + baseHref + '">' : '';
      var srcdoc = hasHead
        ? html.replace(/<head[^>]*>/i, function(m){ return m + baseTag; })
        : '<!doctype html><html><head>' + baseTag + '</head><body>' + html + '</body></html>';
      pv.srcdoc = srcdoc;
    }

    async function loadSignature() {
      try {
        var r = await fetch(sigUrl, { cache: "no-store" });
        if (!r.ok) throw new Error("No se pudo leer signature.html");
        var txt = await r.text();
        ta.value = txt;
        initial = txt;
        markDirty();
        msg.textContent = "Cargado ✔";
        setTimeout(function(){ msg.textContent = ""; }, 1500);
        updatePreview(txt, window.location.origin + "/");
      } catch (e) {
        alert(e.message || e);
      }
    }

    async function saveSignature() {
      var body = ta.value;
      if (!body.trim()) { alert("Pega contenido antes de guardar."); return; }
      try {
        var r = await fetch(sigUrl, {
          method: "PUT",
          headers: { "Content-Type": "text/plain; charset=utf-8" },
          body: body
        });
        if (!r.ok) {
          var t = "";
          try { t = await r.text(); } catch(_) {}
          throw new Error("No se pudo guardar: " + t);
        }
        initial = body; markDirty();
        msg.textContent = "Guardado ✔";
        setTimeout(function(){ msg.textContent = ""; }, 1500);
        if (typeof onSaved === "function") onSaved(); // refrescar preview del padre
      } catch (e) {
        alert(e.message || e);
      }
    }

    function readFile(file) {
      var reader = new FileReader();
      reader.onload = function() {
        var html = String(reader.result || "");
        ta.value = html; markDirty();
        msg.textContent = "Importado: " + (file && file.name || "");
        // Blob URL como base para rutas relativas
        var blob = new Blob([html], { type: "text/html" });
        var url = URL.createObjectURL(blob);
        updatePreview(html, url);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
      };
      reader.onerror = function(){ alert("No se pudo leer el archivo."); };
      reader.readAsText(file, "utf-8");
    }

    // ---------- Eventos ----------
    btnLoad.addEventListener("click", loadSignature);
    btnSave.addEventListener("click", saveSignature);
    btnPaste.addEventListener("click", async function(){
      try {
        var txt = await navigator.clipboard.readText();
        if (!txt) { alert("El portapapeles está vacío"); return; }
        ta.value = txt; markDirty();
        updatePreview(txt, window.location.origin + "/");
        msg.textContent = "Pegado ✔";
        setTimeout(function(){ msg.textContent = ""; }, 1500);
      } catch {
        alert("No se pudo acceder al portapapeles. Usa Ctrl/Cmd+V.");
        ta.focus();
      }
    });
    btnOpenTab.addEventListener("click", function(){
      var html = ta.value || "";
      var blob = new Blob([html], { type: "text/html" });
      var url = URL.createObjectURL(blob);
      window.open(url, "_blank");
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    });
    btnClose.addEventListener("click", function(){
      if (dirty && !confirm("Hay cambios sin guardar. ¿Cerrar de todos modos?")) return;
      w.close();
    });
    btnFile.addEventListener("click", function(){ fileInput.click(); });
    fileInput.addEventListener("change", function(){
      var f = fileInput.files && fileInput.files[0];
      if (f) readFile(f);
      fileInput.value = "";
    });
    ta.addEventListener("input", function(){
      markDirty();
      updatePreview(ta.value, window.location.origin + "/");
    });
    d.addEventListener("keydown", function(e){
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
        e.preventDefault(); saveSignature();
      }
    });

    // Carga inicial
    loadSignature();
  }

  window.openImportModalUpdateNewsletter = function ({ slug, lang, refresh }) {
    window.uploadMode = "actualizar_newsletter";
    window.currentSlug = slug || "";
    window.currentLang = lang || "es";
    window.currentRefresh = typeof refresh === "function" ? refresh : null;

    if (typeof resetImportModal === "function") {
      resetImportModal();
    }

    // Cerrar preview antes de abrir import
    document.getElementById("previewModal")?.classList.add("hidden");

    document.getElementById("modalTitle").textContent = "Actualizar Newsletter";

    document.getElementById("dropZone").textContent = "Arrastra aquí un .html o .zip de newsletter, o haz clic para seleccionar";

    document.getElementById("templateName").value = window.currentSlug;
    document.getElementById("templateName").readOnly = true;

    document.getElementById("templateType").value = "newsletter";
    document.getElementById("templateType").disabled = true;

    document.getElementById("templateLang").value = window.currentLang;
    document.getElementById("templateLang").disabled = true;

    document.getElementById("templateHtmlBlock").classList.add("hidden");

    const fileInput = document.getElementById("fileInput");
    fileInput.value = "";
    fileInput.accept = ".html,.htm,.zip";

    document.getElementById("fileInputLabel").textContent =
      "Selecciona el archivo para actualizar la newsletter (.html o .zip)";

    document.getElementById("btnUploadTemplate").textContent = "Actualizar newsletter";

    document.getElementById("importModal").classList.remove("hidden");
  };





};
