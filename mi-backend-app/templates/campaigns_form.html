{% extends "base.html" %}

{% block content %}

<h3 class="text-3xl text-center font-bold text-blue-700 mb-6 flex items-baseline gap-3">{{ 'Editar' if item else 'Nueva' }} campaña</h3>

<form method="POST" class="card p-3" id="campaignForm">
  <div class="mb-3">
    
    <label class= "block text-sm font-medium text-gray-700 mb-1" >Nombre</label>
    <input class="form-control" name="name" value="{{ item.name if item else '' }}" required>
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
     <label class= "block text-sm font-medium text-gray-700 mb-1" >Tipo</label>
      <select class="form-select" name="campaign_type" id="campaignType" required>
        <option value="emailing" {{ 'selected' if item and item.campaign_type=='emailing' else '' }}>emailing</option>
        <option value="newsletter" {{ 'selected' if item and item.campaign_type=='newsletter' else '' }}>newsletter</option>
      </select>
    </div>

    <div class="col-md-4 mb-3" id="newsletterBoxES">
      <label class="form-label">Newsletter Español</label>
      <select class="form-select" name="newsletter_es_id">
        <option value="">-- seleccionar --</option>
        {% for n in newsletters if n.lang == 'es' %}
          <option value="{{ n.id }}"
            {% if item and item.newsletter_es_id == n.id %}selected{% endif %}>
            {{ n.name }}
          </option>
        {% endfor %}
      </select>
    </div>


    <div class="col-md-4 mb-3" id="newsletterBoxEN">
      <label class="form-label">Newsletter Inglés</label>
      <select class="form-select" name="newsletter_en_id">
        <option value="">-- seleccionar --</option>
        {% for n in newsletters if n.lang == 'en' %}
          <option value="{{ n.id }}"
            {% if item and item.newsletter_en_id == n.id %}selected{% endif %}>
            {{ n.name }}
          </option>
        {% endfor %}
      </select>
    </div>
    {% if item %}
    <div class="col-md-4 mb-3">
      <label class= "block text-sm font-medium text-gray-700 mb-1" >Estado</label>
      <select class="form-select" name="status">
        {% for s in ['draft','ready','sending','sent','cancelled'] %}
          <option value="{{s}}" {{ 'selected' if item.status==s else '' }}>{{s}}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label class= "block text-sm font-medium text-gray-700 mb-1" >Sender</label>
      <input
        class="form-control"
        type="email"
        name="sender"
        value="{{ item.sender if item else '' }}"
        placeholder="info@tudominio.com"
        required
      >
    </div>

    <div class="col-md-4 mb-3">
      <label class= "block text-sm font-medium text-gray-700 mb-1" >Reply-To</label>
      <input
        class="form-control"
        type="email"
        name="reply_to"
        value="{{ item.reply_to if item else '' }}"
        placeholder="soporte@tudominio.com"
      >
    </div>
    <div class="col-md-4 mb-3">
      <label class="block text-sm font-medium text-gray-700 mb-1">Idioma</label>
      <select class="form-select" name="idioma" required>
        <option value="es" {{ 'selected' if item and item.idioma=='es' else '' }}>Español</option>
        <option value="en" {{ 'selected' if item and item.idioma=='en' else '' }}>Inglés</option>
        <option value="both" {{ 'selected' if item and item.idioma=='both' else '' }}>Ambos</option>
      </select>
    </div>

    
  </div>
  <div class="row">
    <div class="col-md-6 mb-3" id="subjectEsBox">
      <label class="block text-sm font-medium text-gray-700 mb-1">Subject Español</label>
      <input
        id="subjectEsInput"
        class="form-control"
        type="text"
        name="subject_es"
        value="{{ item.subject_es if item else '' }}"
        placeholder="Asunto en español"
      >
    </div>

    <div class="col-md-6 mb-3" id="subjectEnBox">
      <label class="block text-sm font-medium text-gray-700 mb-1">Subject Inglés</label>
      <input
        id="subjectEnInput"
        class="form-control"
        type="text"
        name="subject_en"
        value="{{ item.subject_en if item else '' }}"
        placeholder="Subject in English"
      >
    </div>
  </div>
  <div class="d-flex gap-2">

    <button class="btn btn-primary bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg shadow-md transition duration-200">Guardar</button>
    <a class="btn btn-outline-secondary  bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600" href="{{ url_for('campanas') }}">Volver</a>
  </div>
</form>

<script>

(function () {
  const idiomaSelect = document.querySelector('[name="idioma"]');
  const subjectEsBox = document.getElementById('subjectEsBox');
  const subjectEnBox = document.getElementById('subjectEnBox');

  function refreshSubjects() {
    const idioma = idiomaSelect.value;

    subjectEsBox.style.display = (idioma === 'es' || idioma === 'both') ? 'block' : 'none';
    subjectEnBox.style.display = (idioma === 'en' || idioma === 'both') ? 'block' : 'none';
  }

  idiomaSelect.addEventListener('change', refreshSubjects);
  refreshSubjects();
})();

(function(){

  const idiomaSelect = document.querySelector('[name="idioma"]');

  const boxES = document.getElementById("newsletterBoxES");
  const boxEN = document.getElementById("newsletterBoxEN");

  function refresh(){

    const idioma = idiomaSelect.value;

    if (idioma === "es") {

      boxES.style.display = "block";
      boxEN.style.display = "none";

    }

    else if (idioma === "en") {

      boxES.style.display = "none";
      boxEN.style.display = "block";

    }

    else if (idioma === "both") {

      boxES.style.display = "block";
      boxEN.style.display = "block";

    }

  }

  idiomaSelect.addEventListener("change", refresh);

  refresh();

})();




(function(){
  const type = document.getElementById('campaignType');
  const box = document.getElementById('newsletterBox');
  const sel = document.getElementById('newsletterId');

  function refresh(){
    const isNewsletter = type.value === 'newsletter';
    box.style.display = isNewsletter ? 'block' : 'none';
    if(!isNewsletter) sel.value = '';
  }
  type.addEventListener('change', refresh);
  refresh();
})();
</script>

{% endblock %}
