<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <title>Pro Forma Invoice Request</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; }
    h2, label, button, .display { font-family: 'Poppins', sans-serif; }
    .lp-input {
      background:#1a2a4a; border:1px solid #2a3a5a; color:#EBF1F2;
      transition:border-color .2s, box-shadow .2s;
    }
    .lp-input::placeholder { color:#6b82a8; }
    .lp-input:focus {
      outline:none; background:#1f3252;
      border-color:#135EF2; box-shadow:0 0 0 3px rgba(19,94,242,.25);
    }
    .lp-btn {
      background:#135EF2; border:none; text-shadow:none;
      -webkit-font-smoothing:antialiased;
      transition:background-color .2s, box-shadow .2s, transform .1s;
    }
    .lp-btn:hover {
      background:#6fa0ff;
      box-shadow:0 0 9px rgba(111,160,255,.35);
    }
    .lp-btn:active { transform:scale(.98); }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6" style="background:#000814;">

    <div class="shadow-2xl rounded-2xl w-full max-w-2xl p-10 border"
         style="background:#011640; border-color:#1a2a4a; border-radius:16px;">

     <!-- Logos -->
        <div class="flex justify-between items-center mb-8">
            <img src="https://ledpadel.com/wp-content/uploads/2026/06/logo-PLANET.png"
                class="h-auto object-contain" style="max-width:100px;">
            <img src="https://ledpadel.com/wp-content/uploads/2026/04/logo_lPadelBlanco.png"
                class="h-auto object-contain" style="max-width:100px;">
    </div>

    <h2 class="text-2xl font-extrabold text-center mb-2" style="color:#FFFFFF;">
      {{ titulo }}
    </h2>

    <p class="text-center mb-8" style="color:#8aaed4;">
      Quote: <strong style="color:#6fa0ff;">{{ quote_number }}</strong>
    </p>

    <form id="proforma-form" class="space-y-4">

      <!-- Token oculto -->
      <input type="hidden" id="token" value="{{ token }}">
      <!-- Flag coming from backend -->
      <input type="hidden" id="idMode" value="{{ id_mode }}">
      <input type="hidden" id="sessionId" value="{{  session_id }}">


      <div>
        <label class="block text-sm font-semibold mb-1" style="color:#EBF1F2;">Name / Company name</label>
        <input type="text" id="name" required
               class="lp-input w-full px-4 py-2 rounded-lg">
      </div>

      <!-- Identificación dinámica -->
      <div id="identificacion-block">
        <label id="identificacion-label" class="block text-sm font-semibold mb-1" style="color:#EBF1F2;">Identification</label>
        <input
          type="text"
          id="identificacion"
          name="identificacion"
          required
          class="lp-input w-full px-4 py-2 rounded-lg"
        >
        <p id="identificacion-hint" class="text-xs mt-1" style="color:#8aaed4;"></p>
      </div>

      <!-- Campo extra opcional -->
      <div id="registro-block" class="hidden">
        <label class="block text-sm font-semibold mb-1" style="color:#EBF1F2;">Registration No.</label>
        <input
          type="text"
          id="nRegistro"
          name="nRegistro"
          class="lp-input w-full px-4 py-2 rounded-lg"
        >
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1" style="color:#EBF1F2;">Address 1</label>
        <input type="text" id="direccion1" required
               class="lp-input w-full px-4 py-2 rounded-lg">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1" style="color:#EBF1F2;">Address 2</label>
        <input type="text" id="direccion2"
               class="lp-input w-full px-4 py-2 rounded-lg">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1" style="color:#EBF1F2;">Postal Code</label>
          <input type="text" id="codigoPostal" required
                 class="lp-input w-full px-4 py-2 rounded-lg">
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1" style="color:#EBF1F2;">City</label>
          <input type="text" id="poblacion" required
                 class="lp-input w-full px-4 py-2 rounded-lg">
        </div>
      </div>

      <div class="text-center pt-4">
        <button type="submit"
                class="lp-btn text-white px-8 py-3 font-normal"
                style="border-radius:999px;">
          Submit request
        </button>
      </div>

      <p id="message" class="text-center text-sm mt-4"></p>
    </form>
  </div>

  <script>
  
  window.API_BASE = "{{ api_base_url }}";
  const base = (window.API_BASE || "").replace(/\/$/, "");
  const endpoint = "{{ 'renting_submit' if origen == 'renting' else 'proforma_submit' }}";
  const url = `${base}/${endpoint}`;
 
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById("proforma-form");
    const msg = document.getElementById("message");

    const mode = (document.getElementById('idMode')?.value || '').toUpperCase();
    const label = document.getElementById('identificacion-label');
    const input = document.getElementById('identificacion');
    const hint  = document.getElementById('identificacion-hint');
    const regBlock = document.getElementById('registro-block');
    const regInput = document.getElementById('nRegistro');

    // defaults
    label.textContent = 'Identification';
    input.placeholder = '';
    hint.textContent = '';
    regBlock.classList.add('hidden');
    if (regInput) regInput.required = false;

    if (mode === 'VAT') {
      label.textContent = 'VAT (intra-community)';
      input.placeholder = 'e.g. ESB12345678 / DE123456789';
      hint.textContent = 'Enter your VAT with country prefix (ES, FR, DE...).';
    } else if (mode === 'NIF') {
      label.textContent = 'NIF/CIF';
      input.placeholder = 'e.g. B12345678 / 12345678A';
      hint.textContent = 'Enter NIF/CIF (Spain).';
    } else if (mode === 'REGISTRO') {
      label.textContent = 'Registration No.';
      input.placeholder = 'e.g. 12345 / ABC-987';
      hint.textContent = 'Enter the registration number.';
    } else if (mode === 'VAT+REGISTRO') {
      label.textContent = 'VAT (intra-community)';
      input.placeholder = 'e.g. ESB12345678 / DE123456789';
      regBlock.classList.remove('hidden');
      if (regInput) regInput.required = true;
    }

    if (!form) return;

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
        setTimeout(() => {
            document.body.innerHTML = `
            <div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;color:#EBF1F2;background:#000814;">
                <h2>The session has expired</h2>
            </div>
            `;
        }, 120000);

      const payload = {
        token: document.getElementById("token")?.value || "",
        session_id: document.getElementById("sessionId")?.value || "",

        name: document.getElementById("name")?.value.trim() || "",
        direccion1: document.getElementById("direccion1")?.value.trim() || "",
        direccion2: document.getElementById("direccion2")?.value.trim() || "",
        codigoPostal: document.getElementById("codigoPostal")?.value.trim() || "",
        poblacion: document.getElementById("poblacion")?.value.trim() || "",

        idMode: document.getElementById("idMode")?.value.trim() || "",
        identificacion: document.getElementById("identificacion")?.value.trim() || "",
        nRegistro: document.getElementById("nRegistro")?.value.trim() || ""
      };

      msg.textContent = "Processing...";
      msg.className = "text-center text-sm mt-4";
      msg.style.color = "#8aaed4";

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok || !result.ok) {
          msg.textContent = result.message || "Request error.";
          msg.className = "text-center text-sm mt-4";
          msg.style.color = "#ff6b6b";
          return;
        }

        msg.textContent = result.message || "Request submitted successfully.";
        msg.className = "text-center text-sm mt-4";
        msg.style.color = "#4ade80";

      } catch (err) {
        msg.textContent = "Connection error.";
        msg.className = "text-center text-sm mt-4";
        msg.style.color = "#ff6b6b";
      }
    });
  });
  </script>
</body>
</html>
