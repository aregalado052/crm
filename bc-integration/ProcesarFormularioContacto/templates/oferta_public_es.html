<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <title>Solicitud de Oferta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center p-6" style="background:#EAF3FB;">

  <div class="bg-white shadow-2xl rounded-2xl w-full max-w-xl p-10 border border-blue-100">

    <!-- Logos -->
    <div class="flex justify-between items-center mb-6">
      <img src="https://f.crmplanetpower.es/Logo Planet Power.png" class="h-14 object-contain">
      <img src="https://f.crmplanetpower.es/Logo LEDPADEL azul y verde.png" class="h-14 object-contain">
    </div>

    <h2 class="text-2xl font-bold text-center text-[#5B9BD5] mb-6">
      Solicitud de oferta
    </h2>

    <form id="oferta-form" class="space-y-4">

      <input type="hidden" id="token" value="{{ token }}">
      <input type="hidden" id="sessionId" value="{{ session_id }}">

      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium mb-1">Nombre</label>
        <input type="text" id="name" required
               class="w-full px-4 py-2 rounded-lg border border-gray-300 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-[#5B9BD5]">
      </div>

      <!-- País -->
      <div>
        <label class="block text-sm font-medium mb-1">País</label>
        <input type="text" id="pais" required
               value="{{ pais or '' }}"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-[#5B9BD5]">
      </div>

      <!-- Idioma -->
      <div>
        <label class="block text-sm font-medium mb-1">Idioma</label>
        <select id="idioma" required
                class="w-full px-4 py-2 rounded-lg border border-gray-300 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-[#5B9BD5]">
          <option value="">Selecciona</option>
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </div>

      <!-- Nº pistas -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Pistas Perimetrales</label>
          <input type="number" id="pistas_perimetrales" min="0" required
                 class="w-full px-4 py-2 rounded-lg border border-gray-300 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-[#5B9BD5]">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Pistas Laterales</label>
          <input type="number" id="pistas_laterales" min="0" required
                 class="w-full px-4 py-2 rounded-lg border border-gray-300 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-[#5B9BD5]">
        </div>
      </div>

      <!-- Submit -->
      <div class="text-center pt-4">
        <button type="submit"
                class="bg-[#5B9BD5] text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
          Solicitar oferta
        </button>
      </div>

      <p id="message" class="text-center text-sm mt-4"></p>

    </form>
  </div>

  <script>
    window.API_BASE = "{{ api_base_url }}";
    const base = (window.API_BASE || "").replace(/\/$/, "");
    const url = `${base}/oferta_submit`;

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById("oferta-form");
      const msg = document.getElementById("message");

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const payload = {
          token: document.getElementById("token")?.value || "",
          session_id: document.getElementById("sessionId")?.value || "",

          name: document.getElementById("name")?.value.trim(),
          pais: document.getElementById("pais")?.value.trim(),
          idioma: document.getElementById("idioma")?.value,
          pistas_perimetrales: document.getElementById("pistas_perimetrales")?.value,
          pistas_laterales: document.getElementById("pistas_laterales")?.value
        };

        if (!payload.name || !payload.pais || !payload.idioma) {
          msg.textContent = "Todos los campos son obligatorios.";
          msg.className = "text-red-600 text-center mt-4";
          return;
        }

        msg.textContent = "Procesando...";
        msg.className = "text-gray-600 text-center mt-4";

        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const result = await response.json();

          if (!result.ok) {
            msg.textContent = result.message || "Error.";
            msg.className = "text-red-600 text-center mt-4";
            return;
          }

          msg.textContent = "Solicitud enviada correctamente.";
          msg.className = "text-green-600 text-center mt-4";

        } catch (e) {
          msg.textContent = "Error de conexión.";
          msg.className = "text-red-600 text-center mt-4";
        }
      });
    });
  </script>
</body>
</html>
